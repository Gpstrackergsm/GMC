<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&amp;family=Inter:wght@800&amp;display=swap');
      .brand-title {
        font-family: 'Montserrat', -apple-system, sans-serif;
        font-size: 40px;
        font-weight: 900;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        fill: #111827;
      }
      .brand-accent {
        fill: #367C2B;
      }
      .brand-sub {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        fill: #1E3F20;
      }
    </style>
  </defs>

  <!-- Mower Haven Industrial Shield Emblem -->
  <g transform="translate(10, 10)">
    <!-- Shield Outline -->
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#1E3F20" stroke="#FFDE00" stroke-width="4.5"/>
    <rect x="5" y="5" width="70" height="70" rx="13" fill="none" stroke="rgba(255,222,0,0.3)" stroke-width="1.5"/>

    <!-- Large Rear Wheel -->
    <circle cx="27" cy="51" r="13" fill="#111827" stroke="#FFDE00" stroke-width="3"/>
    <circle cx="27" cy="51" r="6" fill="#FFDE00"/>
    <circle cx="27" cy="51" r="2.5" fill="#111827"/>

    <!-- Front Steer Wheel -->
    <circle cx="58" cy="53" r="9" fill="#111827" stroke="#FFDE00" stroke-width="2.5"/>
    <circle cx="58" cy="53" r="4" fill="#FFDE00"/>
    <circle cx="58" cy="53" r="1.5" fill="#111827"/>

    <!-- Mower Hood & Engine Chassis Body -->
    <path d="M 28 42 L 34 26 L 48 26 L 52 35 L 63 35 L 65 46 L 52 46 L 50 44 L 32 44 Z" fill="#FFDE00"/>

    <!-- Steering Column -->
    <path d="M 42 26 L 44 19 M 40 19 L 48 19" stroke="#FFDE00" stroke-width="3" stroke-linecap="round"/>

    <!-- Operator Seat -->
    <path d="M 31 34 L 34 34 L 34 26" stroke="#1E3F20" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Cutting Deck -->
    <rect x="34" y="47" width="16" height="6" rx="2" fill="#367C2B" stroke="#FFDE00" stroke-width="1.5"/>

    <!-- Ground / Turf Horizon Blade Lines -->
    <line x1="12" y1="67" x2="68" y2="67" stroke="#367C2B" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="71" x2="58" y2="71" stroke="#FFDE00" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography Group -->
  <g transform="translate(108, 0)">
    <text x="0" y="52" class="brand-title">MOWER <tspan class="brand-accent">HAVEN</tspan></text>
    <text x="2" y="73" class="brand-sub">OUTDOOR POWER &amp; TURF EQUIPMENT</text>
    <line x1="330" y1="70" x2="415" y2="70" stroke="#FFDE00" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
